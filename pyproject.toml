[project]
name = "ntk-bot"
version = "0.1.0"
description = "Telegram bot for @chat_ntk that tracks National Technical Library occupancy and predicts visits."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp>=3.14",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "python-decouple>=3.8",
    "numpy>=2.5",
    "matplotlib>=3.11",
    "catboost>=1.2.10",
    "holidays>=0.107",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
]

[project.scripts]
ntk-bot = "bot:run"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "ty>=0.0.93",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.14"

# aiogram statically types message.from_user / .text and callback_query.data as
# Optional, but populates them for the message/callback types these handlers are
# registered against. Suppress that framework-level noise in the thin handler
# layer while keeping full strictness on the business logic in apps/.
[[tool.ty.overrides]]
include = ["bot/"]
rules = { unresolved-attribute = "ignore", not-subscriptable = "ignore" }

# matplotlib's type stubs reject datetime/list arguments that work at runtime.
[[tool.ty.overrides]]
include = ["apps/plot_functions.py", "apps/weather_api.py"]
rules = { invalid-argument-type = "ignore" }
