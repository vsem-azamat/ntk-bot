name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
      SSH_USER: ${{ secrets.DEMO_SSH_USER }}
      SSH_PORT: ${{ secrets.DEMO_SSH_PORT || '22' }}
      DEPLOY_DIR: ${{ secrets.NTK_DEPLOY_DIR }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SUPER_ADMINS: ${{ secrets.SUPER_ADMINS }}
      DELTA_TIME: ${{ secrets.DELTA_TIME || '20' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openai/gpt-6-luna' }}
      ANSWER_PROBABILITY: ${{ secrets.ANSWER_PROBABILITY || '0.025' }}
      DIGEST_ENABLED: ${{ secrets.DIGEST_ENABLED || 'false' }}
      DIGEST_CHAT_ID: ${{ secrets.DIGEST_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
      ALERT_THREAD_ID: ${{ secrets.ALERT_THREAD_ID }}
    steps:
      - name: Checkout workflow run SHA
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout dispatch SHA
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Validate deployment secrets
        env:
          SSH_KEY_PRESENT: ${{ secrets.DEMO_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing DEMO_SSH_HOST"
          [ -z "$SSH_USER" ] && missing="$missing DEMO_SSH_USER"
          [ "$SSH_KEY_PRESENT" != "true" ] && missing="$missing DEMO_SSH_KEY"
          [ -z "$DEPLOY_DIR" ] && missing="$missing NTK_DEPLOY_DIR"
          [ -z "$BOT_TOKEN" ] && missing="$missing BOT_TOKEN"
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$DATABASE_CA_CERT" ] && missing="$missing DATABASE_CA_CERT"
          if [ -n "$missing" ]; then
            echo "::error::Missing required deployment secrets:$missing"
            exit 1
          fi

      - name: Validate deploy target
        run: |
          set -euo pipefail
          case "$DEPLOY_DIR" in
            /*) ;;
            *) echo "::error::NTK_DEPLOY_DIR must be an absolute path"; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install rsync
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_DIR/infra'"

      - name: Sync deployment files
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            infra/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/infra/"

      - name: Render remote .env from secrets
        run: |
          set -euo pipefail
          tmp_env="$(mktemp)"
          chmod 600 "$tmp_env"
          {
            echo "NTK_BOT_IMAGE=${REGISTRY}/${IMAGE_NAME}:latest"
            echo "BOT_TOKEN=${BOT_TOKEN}"
            echo "SUPER_ADMINS=${SUPER_ADMINS}"
            echo "DELTA_TIME=${DELTA_TIME}"
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
            echo "OPENROUTER_MODEL=${OPENROUTER_MODEL}"
            echo "ANSWER_PROBABILITY=${ANSWER_PROBABILITY}"
            echo "DIGEST_ENABLED=${DIGEST_ENABLED}"
            [ -n "$DIGEST_CHAT_ID" ] && echo "DIGEST_CHAT_ID=${DIGEST_CHAT_ID}"
            [ -n "$ALERT_CHAT_ID" ] && echo "ALERT_CHAT_ID=${ALERT_CHAT_ID}"
            [ -n "$ALERT_THREAD_ID" ] && echo "ALERT_THREAD_ID=${ALERT_THREAD_ID}"
            echo "DATA_DIR=/data"
            echo "DATABASE_URL=${DATABASE_URL}"
          } > "$tmp_env"
          rsync -az --chmod=F600 \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            "$tmp_env" "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/.env"
          rm -f "$tmp_env"
          # CA that signs the database server certificate (sslmode=verify-full).
          tmp_ca="$(mktemp)"
          printf '%s\n' "$DATABASE_CA_CERT" > "$tmp_ca"
          rsync -az --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            "$tmp_ca" "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/db-ca.crt"
          rm -f "$tmp_ca"

      # Pull with this job's short-lived token, kept in a project-local Docker
      # config so it neither depends on nor overwrites the host's shared
      # ~/.docker/config.json (other deploys rewrite the ghcr.io entry there).
      - name: Log in to GHCR on the host
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "DOCKER_CONFIG='$DEPLOY_DIR/.docker' docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy compose stack
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' && chmod +x infra/deploy.sh && DOCKER_CONFIG='$DEPLOY_DIR/.docker' ./infra/deploy.sh"
