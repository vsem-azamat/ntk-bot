name: ntk-bot

services:
  bot:
    image: ${NTK_BOT_IMAGE:?NTK_BOT_IMAGE is required}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
    volumes:
      - ntk_data:/data
      # CA for the PostgreSQL server certificate; DATABASE_URL points
      # sslrootcert at this path.
      - ../db-ca.crt:/run/ntk/db-ca.crt:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,sys,time;
          p='/data/heartbeat';
          sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/db-backup.sh"]
    # Dumps belong to the deploy user on the host, not root.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    volumes:
      - ./db-backup.sh:/opt/db-backup.sh:ro
      - ../db-ca.crt:/run/ntk/db-ca.crt:ro
      - ../backups:/backups
    logging:
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  ntk_data:
